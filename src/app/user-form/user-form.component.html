<h2>User Registration</h2>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <label>
    Name:
    <input type="text" formControlName="name" />
  </label>
  <div
    *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid"
    style="color: red"
  >
    Name is required.
  </div>

  <label>
    Email:
    <input type="email" formControlName="email" />
  </label>
  <div
    *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid"
    style="color: red"
  >
    <div *ngIf="userForm.get('email')?.errors?.['required']">
      Email is required.
    </div>
    <div *ngIf="userForm.get('email')?.errors?.['email']">
      Enter a valid email.
    </div>
  </div>

  <ng-container *ngFor="let faveColor of faveColorGroups; let i = index">
    <div [formGroup]="faveColor">
      <label>
        Favorite Color {{ i + 1 }}:
        <input type="text" formControlName="color" />
      </label>
    </div>
  </ng-container>
  

  <div
    *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid"
    style="color: red"
  >
    Name is required.
  </div>

  <button type="button" (click)="addColor()">Add color</button>
  <button type="submit" [disabled]="userForm.invalid">Submit</button>
  <button type="button" (click)="onReset()">Reset</button>
</form>

<div *ngIf="submittedData" style="margin-top: 20px">
  <h3>Submitted Data</h3>
  <pre> {{ submittedData.name }} : {{ submittedData.email }}</pre>
</div>
